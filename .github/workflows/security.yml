name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 2 * * 1'
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: sv_security_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SECURITY_TEST_DB: 'true'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: sv_security_ci
      DB_USER: root
      DB_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Build non-root container
        run: docker build -t student-voice-security-check .
      - name: Test the actual restricted container with MySQL
        run: node --test tests/access.test.mjs
        env:
          SECURITY_TEST_CONTAINER: 'true'
          SECURITY_TEST_IMAGE: student-voice-security-check
          DB_NAME: sv_security_container_ci
      - name: Create production dependency inventory
        run: npm sbom --sbom-format=cyclonedx --omit=dev > sbom.cdx.json
      - name: Save dependency inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-dependency-inventory
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build container for scanning
        run: docker build -t student-voice-security-check .
      - name: Test the restricted runtime
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges
          --entrypoint node student-voice-security-check --input-type=module
          -e "import express from 'express'; import sharp from 'sharp'; import * as OTPAuth from 'otpauth'; import {access} from 'node:fs/promises'; if(process.getuid()===0) throw Error('Runtime must not be root'); await access('/usr/local/bin/npm').then(()=>{throw Error('npm must not ship in runtime')},()=>{}); await sharp({create:{width:2,height:2,channels:3,background:'#fff'}}).webp().toBuffer(); if(!express || !OTPAuth.TOTP) throw Error('Missing runtime dependency');"
      - name: Scan container packages
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: student-voice-security-check:latest
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      - name: Publish container findings
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-packages
